DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING: /DATA/disk0/zhaobojun/all_stereo_training_data/sceneflow_data/SceneFlow_finalpass_train.txt,
                EVALUATING: /DATA/disk0/zhaobojun/all_stereo_training_data/sceneflow_data/SceneFlow_finalpass_test.txt,
                TESTING: /DATA/disk0/zhaobojun/all_stereo_training_data/sceneflow_data/SceneFlow_finalpass_test.txt
            }
            RETURN_RIGHT_DISP: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: StereoColorJitter, BRIGHTNESS: [ 0.6, 1.4 ], CONTRAST: [ 0.6, 1.4 ], SATURATION: [ 0.6, 1.4 ], HUE: 0.5, ASYMMETRIC_PROB: 0.2 }
            - { NAME: RandomErase, PROB: 0.5, MAX_TIME: 2, BOUNDS: [ 50, 100 ] }
            - { NAME: RandomScale, SIZE: [ 320, 736 ], MIN_SCALE: -0.1, MAX_SCALE: 0.2, SCALE_PROB: 0.8, STRETCH_PROB: 0.5 }
            - { NAME: RandomCrop, SIZE: [ 320, 736 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            # 🔥 geometry augmentation
            - { NAME: CameraGeometryAugmentation, F_RANGE: [300, 500], BASELINE_RANGE: [0.4, 0.7]}
            # - { NAME: CameraGeometryAugmentation, F_RANGE: [400, 800], BASELINE_RANGE: [0.1, 1.2]}
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: CameraGeometryForEval, F: 400.0, BASELINE: 0.6 }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

MODEL:
    NAME: OmniStereo
    corr_levels: 2
    corr_radius: 4
    hidden_dims: [ 128, 128, 128 ]
    low_memory: 1
    max_disp: 512
    mixed_precision: true
    n_downsample: 2
    n_gru_layers: 3
    vit_size: 'vitl'
    train_iters: 22
    valid_iters: 32
    FREEZE_BACKBONE: false
    FIND_UNUSED_PARAMETERS: true
    CKPT: -1
    use_3d_loss: true
    lambda_disp: 1.0
    lambda_reproj: 0.6
    lambda_3d: 0.2
    disp_threshold: 0.1
    use_camera_geometry: true
    PRETRAINED_MODEL: '/DATA/disk0/zhaobojun/foundationstereo_model/pretrained_models/23-51-11/model_best_bp2.pth'

OPTIMIZATION:
    FREEZE_BN: true
    SYNC_BN: true
    AMP: true
    AMP_DTYPE: bf16
    BATCH_SIZE_PER_GPU: 1
    GRADIENT_ACCUMULATION_STEPS: 8
    NUM_EPOCHS: 65

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0001
        # LR: &lr 5e-4 
        WEIGHT_DECAY: 1.0e-04
        EPS: 1.0e-08

    SCHEDULER:
        NAME: CosineAnnealingLR # 执行分段解冻策略用的学习率调度器
        # MAX_LR: *lr
        # PCT_START: 0.1
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: norm
        MAX_NORM: 1.0
        NORM_TYPE: 2

EVALUATOR:
    BATCH_SIZE_PER_GPU: 4
    MAX_DISP: 512
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 30
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True
